<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — OctoBrain</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
  :root{
    --bg-0:#070B14;
    --teal:#14C2C2;
    --cyan:#2EE6E0;
    --text-0:#E6F0F2;
    --text-1:#9FB1BC;
    --text-2:#64748B;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100svh;
    display:grid;
    place-items:center;
    background-color:var(--bg-0);
    background-image:radial-gradient(rgba(45,212,212,.045) 1px,transparent 1px);
    background-size:26px 26px;
    color:var(--text-1);
    font-family:'Chakra Petch','Pretendard Variable','Noto Sans KR','Malgun Gothic',sans-serif;
    text-align:center;
    padding:24px;
    word-break:keep-all;
  }
  img{height:96px;width:auto;margin-inline:auto;filter:drop-shadow(0 0 20px rgba(46,230,224,.3))}
  .code{
    margin-top:28px;
    font-size:clamp(3rem,8vw,4.5rem);
    font-weight:700;
    line-height:1;
    background:linear-gradient(90deg,var(--cyan),var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  h1{margin-top:14px;font-size:1.15rem;font-weight:600;color:var(--text-0)}
  p{margin-top:10px;font-size:.92rem;font-family:'JetBrains Mono',monospace;color:var(--text-2)}
  a.btn{
    display:inline-block;
    margin-top:30px;
    padding:13px 26px;
    border-radius:10px;
    background:linear-gradient(135deg,#14C2C2,#0E9AA6);
    color:#04222A;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
    transition:box-shadow .2s;
  }
  a.btn:hover{box-shadow:0 8px 30px -8px rgba(46,230,224,.5)}
</style>
</head>
<body>
<main>
  <img src="/assets/img/logo-mark.svg" alt="OctoBrain">
  <div class="code">404</div>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>NOT FOUND — 주소가 바뀌었거나 존재하지 않는 페이지입니다.</p>
  <a class="btn" href="/">홈으로 돌아가기</a>
</main>
</body>
</html>
